<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-label="open-compute-mcp terminal workflow preview">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect width="880" height="540" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0" y="0" width="880" height="40" rx="14" fill="#161b22"/>
  <rect x="0" y="28" width="880" height="12" fill="#161b22"/>
  <rect x="0" y="39" width="880" height="2" fill="url(#accentBar)"/>

  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="440" y="24" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="600">open-compute-mcp v0.1.0-alpha.20 — Local MCP Stdio Launcher</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
    <text x="24" y="72" fill="#79c0ff">$ node -e "const m = require('./bin/open-compute-mcp.js'); console.log(m.resolveLaunch({}))"</text>
    <text x="24" y="94" fill="#8b949e">{</text>
    <text x="38" y="114" fill="#d2a8ff">cmd:</text>
    <text x="82" y="114" fill="#a5d6ff">'uvx'</text><text x="124" y="114" fill="#8b949e">,</text>
    <text x="38" y="134" fill="#d2a8ff">args:</text>
    <text x="90" y="134" fill="#a5d6ff">['--from', 'open-compute[mcp,local,uia] @ git+https://github.com/ellmos-ai/open-compute.git@master',</text>
    <text x="98" y="154" fill="#a5d6ff">'open-compute-mcp']</text><text x="248" y="154" fill="#8b949e">,</text>
    <text x="38" y="174" fill="#d2a8ff">how:</text>
    <text x="82" y="174" fill="#3fb950">'uvx (github)'</text>
    <text x="24" y="194" fill="#8b949e">}</text>

    <line x1="24" y1="210" x2="856" y2="210" stroke="#21262d" stroke-width="1"/>

    <text x="24" y="234" fill="#79c0ff">$ npx -y open-compute-mcp</text>
    <text x="24" y="256" fill="#d29922">[open-compute-mcp] captures scaled to 0.5 to cut vision-token cost; coordinates are normalized</text>
    <text x="24" y="276" fill="#d29922">so clicking is unaffected. Set OC_CAPTURE_SCALE=1.0 for full resolution.</text>
    <text x="24" y="298" fill="#8b949e"># Override modes: OPEN_COMPUTE_MCP_CMD (1st) | OPEN_COMPUTE_PYTHON (2nd) | uvx @ OPEN_COMPUTE_GIT_REF (3rd)</text>
    <text x="24" y="318" fill="#8b949e"># Python backend tools (19): capture, observe_filtered, capture_filtered, tree, do, click_name, invoke, ...</text>

    <line x1="24" y1="336" x2="856" y2="336" stroke="#21262d" stroke-width="1"/>

    <text x="24" y="360" fill="#79c0ff">$ npm test</text>
    <text x="24" y="382" fill="#3fb950">✔ sets the half-size default when the caller said nothing</text>
    <text x="24" y="402" fill="#3fb950">✔ OPEN_COMPUTE_MCP_CMD launches the configured child command</text>
    <text x="24" y="422" fill="#3fb950">✔ resolveLaunch defaults to the open-compute master branch when OPEN_COMPUTE_GIT_REF is unset</text>
    <text x="24" y="442" fill="#3fb950">✔ World-Set 11-language README parity, UTF-8/Bidi purity, Mermaid balance, and npm distribution</text>
    <text x="24" y="464" fill="#c9d1d9">ℹ tests 53 | pass 53 | fail 0 | skipped 0</text>
  </g>

  <rect x="24" y="484" width="832" height="36" rx="8" fill="#0f1722" stroke="#1f6feb" stroke-width="1"/>
  <text x="40" y="507" fill="#58a6ff" font-family="Consolas, 'Courier New', monospace" font-size="12">
    Transport: local stdio JSON-RPC · Desktop: Windows WGC / UIA / Win32 · License: MIT · SKILL.md &amp; llms.txt
  </text>
</svg>
